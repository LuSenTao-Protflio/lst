<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = "/lst/";
        var path = window.location.pathname.indexOf(base) === 0
          ? window.location.pathname.slice(base.length)
          : "";
        window.location.replace(base + "?redirect=" + encodeURIComponent(path + window.location.search + window.location.hash));
      })();
    </script>
  </head>
  <body></body>
</html>
