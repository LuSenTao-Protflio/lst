<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var githubBase = "/lst/";
        var isGithubPages = window.location.pathname.indexOf(githubBase) === 0;
        var base = isGithubPages ? githubBase : "/";
        var path = isGithubPages
          ? window.location.pathname.slice(githubBase.length)
          : window.location.pathname.slice(1);
        var target = path + window.location.search + window.location.hash;

        window.location.replace(
          base + "?redirect=" + encodeURIComponent(target),
        );
      })();
    </script>
  </head>
  <body></body>
</html>
